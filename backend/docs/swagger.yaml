basePath: /api/v1
definitions:
  domain.PenjualanHarian:
    properties:
      diskon:
        type: number
      jumlah_trx:
        type: integer
      omzet:
        type: number
      pajak:
        type: number
      tanggal:
        type: string
    type: object
  domain.ProdukTerlaris:
    properties:
      nama:
        type: string
      omzet:
        type: number
      produk_id:
        type: integer
      terjual:
        type: number
    type: object
  http.BuatUsahaRequest:
    properties:
      kode:
        maxLength: 30
        type: string
      nama:
        maxLength: 150
        minLength: 2
        type: string
      owner_email:
        maxLength: 150
        type: string
      owner_nama:
        maxLength: 150
        minLength: 2
        type: string
      owner_password:
        maxLength: 72
        minLength: 8
        type: string
    required:
    - nama
    - owner_email
    - owner_nama
    - owner_password
    type: object
  http.BukaSesiRequest:
    properties:
      catatan:
        maxLength: 255
        type: string
      kas_awal:
        minimum: 0
        type: number
    type: object
  http.CatatPengeluaranRequest:
    properties:
      keterangan:
        maxLength: 255
        minLength: 3
        type: string
      nominal:
        type: number
      tanggal:
        description: kosong = hari ini
        type: string
    required:
    - keterangan
    - nominal
    type: object
  http.CheckoutRequest:
    properties:
      catatan:
        maxLength: 500
        type: string
      dibayar:
        minimum: 0
        type: number
      diskon_nominal:
        minimum: 0
        type: number
      diskon_persen:
        maximum: 100
        minimum: 0
        type: number
      idempotency_key:
        maxLength: 80
        type: string
      items:
        items:
          $ref: '#/definitions/http.ItemCheckoutRequest'
        minItems: 1
        type: array
      pelanggan_id:
        type: integer
      tipe_pembayaran:
        enum:
        - TUNAI
        - TRANSFER
        - QRIS
        type: string
    required:
    - items
    - tipe_pembayaran
    type: object
  http.HoldResponse:
    properties:
      dibuat:
        type: string
      id:
        type: integer
      kasir:
        type: string
      label:
        type: string
      payload:
        type: object
    type: object
  http.ItemCheckoutRequest:
    properties:
      diskon_persen:
        maximum: 100
        minimum: 0
        type: number
      harga:
        description: 0 = pakai harga efektif katalog
        minimum: 0
        type: number
      kuantitas:
        type: number
      pajak_persen:
        maximum: 100
        minimum: 0
        type: number
      produk_id:
        type: integer
    required:
    - kuantitas
    - produk_id
    type: object
  http.ItemStruk:
    properties:
      diskon_persen:
        type: number
      harga:
        type: number
      kuantitas:
        type: number
      nama_produk:
        type: string
      pajak_persen:
        type: number
      satuan:
        type: string
      subtotal:
        type: number
    type: object
  http.KategoriResponse:
    properties:
      id:
        type: integer
      nama:
        type: string
    type: object
  http.LoginRequest:
    properties:
      email:
        example: admin@tuleh.local
        type: string
      password:
        example: admin1234
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  http.OpnameRequest:
    properties:
      keterangan:
        maxLength: 255
        type: string
      produk_id:
        type: integer
      stok_fisik:
        minimum: 0
        type: number
    required:
    - produk_id
    - stok_fisik
    type: object
  http.PelangganResponse:
    properties:
      aktif:
        type: boolean
      catatan:
        type: string
      email:
        type: string
      id:
        type: integer
      nama:
        type: string
      telepon:
        type: string
      wa_link:
        type: string
    type: object
  http.PengaturanResponse:
    properties:
      alamat:
        type: string
      email:
        type: string
      logo_url:
        type: string
      mata_uang:
        type: string
      nama_toko:
        type: string
      pajak_aktif:
        type: boolean
      pajak_persen:
        type: number
      pembulatan:
        type: integer
      struk_footer:
        type: string
      struk_header:
        type: string
      tampilkan_logo:
        type: boolean
      telepon:
        type: string
      ukuran_kertas:
        type: string
    type: object
  http.PengeluaranResponse:
    properties:
      id:
        type: integer
      keterangan:
        type: string
      nominal:
        type: number
      pencatat:
        type: string
      tanggal:
        type: string
    type: object
  http.ProdukResponse:
    properties:
      aktif:
        type: boolean
      barcode:
        type: string
      favorit:
        type: boolean
      harga_beli:
        description: null untuk kasir
        type: number
      harga_efektif:
        type: number
      harga_jual:
        type: number
      harga_promo:
        type: number
      id:
        type: integer
      kategori:
        type: string
      kategori_id:
        type: integer
      kelola_stok:
        type: boolean
      kode:
        type: string
      nama:
        type: string
      promo_aktif:
        type: boolean
      promo_mulai:
        type: string
      promo_selesai:
        type: string
      satuan:
        type: string
      stok:
        type: number
      tipe:
        description: PRODUK | JASA
        type: string
    type: object
  http.QuickPelangganRequest:
    properties:
      nama:
        maxLength: 150
        minLength: 2
        type: string
      telepon:
        maxLength: 25
        type: string
    required:
    - nama
    type: object
  http.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  http.SesiResponse:
    properties:
      catatan:
        type: string
      dibuka_pada:
        type: string
      ditutup_pada:
        type: string
      id:
        type: integer
      kas_akhir:
        type: number
      kas_awal:
        type: number
      kas_sistem:
        type: number
      kasir:
        type: string
      nomor:
        type: string
      selisih:
        type: number
      status:
        type: string
      total:
        additionalProperties:
          format: float64
          type: number
        description: omzet per tipe bayar (rekap)
        type: object
    type: object
  http.SimpanHoldRequest:
    properties:
      label:
        maxLength: 80
        type: string
      payload:
        type: object
    required:
    - payload
    type: object
  http.SimpanKategoriRequest:
    properties:
      nama:
        maxLength: 100
        minLength: 2
        type: string
    required:
    - nama
    type: object
  http.SimpanPelangganRequest:
    properties:
      aktif:
        type: boolean
      catatan:
        maxLength: 255
        type: string
      email:
        maxLength: 150
        type: string
      nama:
        maxLength: 150
        minLength: 2
        type: string
      telepon:
        maxLength: 25
        type: string
    required:
    - aktif
    - nama
    type: object
  http.SimpanPengaturanRequest:
    properties:
      alamat:
        maxLength: 255
        type: string
      email:
        maxLength: 150
        type: string
      logo_url:
        maxLength: 255
        type: string
      mata_uang:
        maxLength: 8
        type: string
      nama_toko:
        maxLength: 150
        minLength: 1
        type: string
      pajak_aktif:
        type: boolean
      pajak_persen:
        maximum: 100
        minimum: 0
        type: number
      pembulatan:
        maximum: 100000
        minimum: 0
        type: integer
      struk_footer:
        maxLength: 255
        type: string
      struk_header:
        maxLength: 255
        type: string
      tampilkan_logo:
        type: boolean
      telepon:
        maxLength: 30
        type: string
      ukuran_kertas:
        enum:
        - 58mm
        - 80mm
        type: string
    required:
    - mata_uang
    - nama_toko
    - pajak_aktif
    - tampilkan_logo
    - ukuran_kertas
    type: object
  http.SimpanProdukRequest:
    properties:
      aktif:
        type: boolean
      barcode:
        maxLength: 60
        type: string
      favorit:
        type: boolean
      harga_beli:
        minimum: 0
        type: number
      harga_jual:
        minimum: 0
        type: number
      harga_promo:
        minimum: 0
        type: number
      kategori_id:
        type: integer
      kelola_stok:
        type: boolean
      kode:
        maxLength: 30
        type: string
      nama:
        maxLength: 150
        minLength: 2
        type: string
      promo_mulai:
        type: string
      promo_selesai:
        type: string
      satuan:
        maxLength: 30
        type: string
      tipe:
        enum:
        - PRODUK
        - JASA
        type: string
    required:
    - aktif
    - harga_jual
    - nama
    - tipe
    type: object
  http.SimpanUserRequest:
    properties:
      aktif:
        type: boolean
      email:
        maxLength: 150
        type: string
      nama:
        maxLength: 150
        minLength: 2
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
      role:
        enum:
        - OWNER
        - MANAGER
        - KASIR
        type: string
    required:
    - aktif
    - email
    - nama
    - role
    type: object
  http.StokLogResponse:
    properties:
      id:
        type: integer
      jenis:
        type: string
      jumlah:
        type: number
      keterangan:
        type: string
      pencatat:
        type: string
      produk:
        type: string
      sesi:
        type: string
      stok_sesudah:
        type: number
      waktu:
        type: string
    type: object
  http.StokMasukRequest:
    properties:
      jumlah:
        type: number
      keterangan:
        maxLength: 255
        type: string
      produk_id:
        type: integer
    required:
    - jumlah
    - produk_id
    type: object
  http.StrukResponse:
    properties:
      catatan:
        type: string
      dibayar:
        type: number
      diskon_nominal:
        type: number
      diskon_persen:
        type: number
      grand_total:
        type: number
      id:
        type: integer
      items:
        items:
          $ref: '#/definitions/http.ItemStruk'
        type: array
      kasir:
        type: string
      kembalian:
        type: number
      nomor:
        type: string
      pelanggan:
        type: string
      pembulatan:
        type: number
      status:
        type: string
      subtotal:
        type: number
      tanggal:
        type: string
      tipe_pembayaran:
        type: string
      total_diskon:
        type: number
      total_pajak:
        type: number
    type: object
  http.TokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        description: detik
        type: integer
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/http.UserResponse'
    type: object
  http.TutupSesiRequest:
    properties:
      catatan:
        maxLength: 255
        type: string
      kas_akhir:
        minimum: 0
        type: number
      sesi_id:
        type: integer
    required:
    - sesi_id
    type: object
  http.UbahUsahaRequest:
    properties:
      aktif:
        type: boolean
      nama:
        maxLength: 150
        minLength: 2
        type: string
    type: object
  http.UsahaResponse:
    properties:
      aktif:
        type: boolean
      dibuat:
        type: string
      id:
        type: integer
      kode:
        type: string
      nama:
        type: string
    type: object
  http.UserResponse:
    properties:
      aktif:
        type: boolean
      dibuat_pada:
        type: string
      diubah_pada:
        type: string
      email:
        type: string
      id:
        type: integer
      nama:
        type: string
      role:
        type: string
    type: object
  respond.Amplop:
    properties:
      data: {}
      errors: {}
      message:
        type: string
      meta:
        $ref: '#/definitions/respond.Meta'
      success:
        type: boolean
    type: object
  respond.Meta:
    properties:
      current_page:
        type: integer
      last_page:
        type: integer
      per_page:
        type: integer
      total:
        type: integer
    type: object
  usecase.RingkasanKeuangan:
    properties:
      bulan:
        type: string
      jumlah_trx:
        type: integer
      laba:
        type: number
      omzet:
        type: number
      pengeluaran:
        type: number
      per_tipe:
        additionalProperties:
          format: float64
          type: number
        type: object
    type: object
info:
  contact: {}
  description: 'Backend mandiri Tuléh POS. Amplop respons: {success, data, meta, message,
    errors}.'
  title: Tuléh Server API
  version: 0.1.0
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Mengembalikan access token (pendek) dan refresh token (panjang).
      parameters:
      - description: Kredensial
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/http.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/respond.Amplop'
            - properties:
                data:
                  $ref: '#/definitions/http.TokenResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/respond.Amplop'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/respond.Amplop'
      summary: Masuk (email + kata sandi)
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh token yang dicabut
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/http.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/respond.Amplop'
      security:
      - BearerAuth: []
      summary: Keluar (cabut refresh token)
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh token
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/http.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/respond.Amplop'
            - properties:
                data:
                  $ref: '#/definitions/http.TokenResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/respond.Amplop'
      summary: Tukar refresh token dengan pasangan token baru (rotasi)
      tags:
      - auth
  /hold:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/respond.Amplop'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/http.HoldResponse'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: Daftar hold (lintas kasir — hold kasir A bisa dilanjutkan kasir B)
      tags:
      - pelanggan
    post:
      consumes:
      - application/json
      description: Payload opaque milik aplikasi kasir (maks 64KB, maks 50 hold).
        Resume = muat payload → checkout biasa → hapus hold.
      parameters:
      - description: Label + keranjang
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/http.SimpanHoldRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/respond.Amplop'
            - properties:
                data:
                  $ref: '#/definitions/http.HoldResponse'
              type: object
        "409":
          description: Hold penuh
          schema:
            $ref: '#/definitions/respond.Amplop'
      security:
      - BearerAuth: []
      summary: Parkir keranjang (hold) — tanpa efek uang/stok
      tags:
      - pelanggan
  /hold/{id}:
    delete:
      parameters:
      - description: ID hold
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/respond.Amplop'
      security:
      - BearerAuth: []
      summary: Hapus hold (setelah resume sukses atau dibuang)
      tags:
      - pelanggan
  /inventory/opname:
    post:
      consumes:
      - application/json
      description: stok_fisik = hasil hitung; server menyimpan SELISIH-nya di riwayat.
      parameters:
      - description: Produk + stok fisik
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/http.OpnameRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/respond.Amplop'
            - properties:
                data:
                  $ref: '#/definitions/http.StokLogResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Opname (koreksi hitung fisik) — Owner/Manager
      tags:
      - inventory
  /inventory/riwayat:
    get:
      parameters:
      - description: Filter produk
        in: query
        name: produk_id
        type: integer
      - description: MASUK|OPNAME|JUAL|BATAL
        in: query
        name: jenis
        type: string
      - description: Halaman
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/respond.Amplop'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/http.StokLogResponse'
                  type: array
                meta:
                  $ref: '#/definitions/respond.Meta'
              type: object
      security:
      - BearerAuth: []
      summary: Riwayat pergerakan stok (MASUK/OPNAME/JUAL/BATAL, satu buku)
      tags:
      - inventory
  /inventory/stok-masuk:
    post:
      consumes:
      - application/json
      parameters:
      - description: Produk + jumlah masuk
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/http.StokMasukRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/respond.Amplop'
            - properties:
                data:
                  $ref: '#/definitions/http.StokLogResponse'
              type: object
        "409":
          description: Produk non-stok (jasa)
          schema:
            $ref: '#/definitions/respond.Amplop'
      security:
      - BearerAuth: []
      summary: Tambah stok (restock) — Owner/Manager
      tags:
      - inventory
  /kategori:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/respond.Amplop'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/http.KategoriResponse'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: Daftar kategori
      tags:
      - produk
    post:
      consumes:
      - application/json
      parameters:
      - description: Nama kategori
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/http.SimpanKategoriRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/respond.Amplop'
            - properties:
                data:
                  $ref: '#/definitions/http.KategoriResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Tambah kategori (Owner/Manager)
      tags:
      - produk
  /kategori/{id}:
    delete:
      parameters:
      - description: ID kategori
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/respond.Amplop'
      security:
      - BearerAuth: []
      summary: Hapus kategori (produk pemakainya dilepas, tidak ikut terhapus)
      tags:
      - produk
  /laporan/keuangan:
    get:
      parameters:
      - description: YYYY-MM (kosong = bulan berjalan)
        in: query
        name: bulan
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/respond.Amplop'
            - properties:
                data:
                  $ref: '#/definitions/usecase.RingkasanKeuangan'
              type: object
      security:
      - BearerAuth: []
      summary: Ringkasan keuangan bulan (omzet, per tipe bayar, pengeluaran, laba)
      tags:
      - laporan
  /laporan/penjualan-harian:
    get:
      parameters:
      - description: YYYY-MM-DD
        in: query
        name: dari
        type: string
      - description: YYYY-MM-DD
        in: query
        name: sampai
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/respond.Amplop'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/domain.PenjualanHarian'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: Omzet per hari (bahan grafik; default 14 hari terakhir)
      tags:
      - laporan
  /laporan/produk-terlaris:
    get:
      parameters:
      - description: Rentang hari (default 30, maks 365)
        in: query
        name: hari
        type: integer
      - description: Jumlah baris (default 10, maks 50)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/respond.Amplop'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/domain.ProdukTerlaris'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: Produk paling laku (dari snapshot item transaksi)
